# ===== Journalisation java.util.logging (étape 11), chargée par LogConfig =====
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# Une ligne par message : heure, niveau, classe, message, puis la pile d'appels éventuelle
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS %4$-7s [%3$s] %5$s%6$s%n

.level=INFO
# Messages de l'application
com.example.level=INFO
# Hibernate et EhCache : seulement les problèmes, sinon leurs messages de démarrage noient ceux de l'application.
# Le SQL reste affiché : show_sql écrit directement dans la console, sans passer par les logs.
org.hibernate.level=WARNING
org.ehcache.level=WARNING
# Avertissement "pool de connexions intégré, pas pour la production" : connu et assumé pour un TP
org.hibernate.orm.connections.pooling.level=SEVERE
