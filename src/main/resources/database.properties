# ===== Connexion à MySQL (serveur local de MySQL Workbench) =====
# Seul endroit où la connexion est décrite : JPA (JpaUtil) et les migrations JDBC (MigrationExecutor) la lisent ici.
# Chaque valeur peut être remplacée au lancement par -Ddb.url=... (les tests s'en servent pour passer sur H2).
#
# createDatabaseIfNotExist=true : la base reservation_salles_db est créée au premier lancement.
# connectionTimeZone=LOCAL      : les dates sont enregistrées à l'heure de la machine,
#                                 Workbench affiche donc les mêmes heures que la console.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/reservation_salles_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
db.user=root
db.password=
db.dialect=org.hibernate.dialect.MySQL8Dialect
